# SPDX-License-Identifier: MIT
# Tenda BE12 Pro 两种独立固件（自动与手动触发）
name: TENDA-BE12-PRO

on:
  # Match X86: build both variants after the daily Auto-Clean workflow finishes.
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      PROFILE:
        description: '编译版本；默认同时编译两版。'
        default: BOTH
        required: true
        type: choice
        options:
          - BOTH
          - PASSWALL
          - DAED
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string

permissions: write-all

jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: ${{fromJSON(inputs.PROFILE == 'PASSWALL' && '["TENDA-BE12-PRO-PASSWALL"]' || inputs.PROFILE == 'DAED' && '["TENDA-BE12-PRO-DAED"]' || '["TENDA-BE12-PRO-PASSWALL","TENDA-BE12-PRO-DAED"]')}}
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_THEME: bootstrap
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: '12345678'
      WRT_IP: 192.168.123.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: ${{inputs.PACKAGE}}
