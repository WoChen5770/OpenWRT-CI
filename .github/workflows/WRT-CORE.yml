#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev clang llvm lld
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          # 同平台的不同设备/版本使用独立缓存键，避免并发写入和轮换冲突。
          if [[ "$WRT_CONFIG" == TENDA-BE12-PRO-* || "$WRT_CONFIG" == "SUPERGATEWAY-S20P" ]]; then
            WRT_CACHE_PREFIX="$WRT_CACHE_PREFIX-$WRT_CONFIG"
          fi
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: ${{ steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "$WRT_CONFIG" == TENDA-BE12-PRO-* ]]; then
            # 共用设备配置，再由具体版本关闭另一套大体积软件包。
            cat "$GITHUB_WORKSPACE/Config/GENERAL.txt" \
              "$GITHUB_WORKSPACE/Config/TENDA-BE12-PRO.txt" \
              "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config
          elif [[ "$WRT_CONFIG" == "X86" || "$WRT_CONFIG" == "TENDA-BE12-PRO" || "$WRT_CONFIG" == "SUPERGATEWAY-S20P" ]]; then
            # 设备配置覆盖通用配置：保留 X86 裁剪和 S20P 的 AdGuard Home 选包。
            cat "$GITHUB_WORKSPACE/Config/GENERAL.txt" "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config
          else
            cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" "$GITHUB_WORKSPACE/Config/GENERAL.txt" >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

          # 两版固件的互斥选包必须在 defconfig 后仍然成立。
          case "$WRT_CONFIG" in
            TENDA-BE12-PRO-PASSWALL)
              for PACKAGE in luci-app-passwall xray-core; do
                grep -qx "CONFIG_PACKAGE_${PACKAGE}=y" .config || {
                  echo "::error::BE12 Pro PassWall package missing: $PACKAGE"; exit 1;
                }
              done
              # luci-app-daede_daed 是独立的 Kconfig choice 选项；主包关闭时
              # 它仍可能显示为 y，但不会因此安装 daed。只核对实际软件包。
              for PACKAGE in luci-app-daede daed; do
                if grep -Eq "^CONFIG_PACKAGE_${PACKAGE}=[ym]$" .config; then
                  echo "::error::BE12 Pro PassWall image unexpectedly includes $PACKAGE"; exit 1;
                fi
              done
              ;;
            TENDA-BE12-PRO-DAED)
              for PACKAGE in luci-app-daede luci-app-daede_daed; do
                grep -qx "CONFIG_PACKAGE_${PACKAGE}=y" .config || {
                  echo "::error::BE12 Pro daed package missing: $PACKAGE"; exit 1;
                }
              done
              for PACKAGE in luci-app-passwall xray-core; do
                if grep -Eq "^CONFIG_PACKAGE_${PACKAGE}=[ym]$" .config; then
                  echo "::error::BE12 Pro daed image unexpectedly includes $PACKAGE"; exit 1;
                fi
              done
              ;;
          esac

          # BE12 Pro never bundles AdGuard Home; Bandix and EasyTier remain opt-in.
          if [[ "$WRT_CONFIG" == TENDA-BE12-PRO-* ]]; then
            for PACKAGE in adguardhome luci-app-adguardhome luci-app-adguardhome-dashboard; do
              if grep -Eq "^CONFIG_PACKAGE_${PACKAGE}=[ym]$" .config; then
                echo "::error::BE12 Pro must not include AdGuard Home: $PACKAGE"; exit 1;
              fi
            done
            if [[ ! -f "$GITHUB_WORKSPACE/Config/PRIVATE.txt" && -z "$WRT_PACKAGE" ]]; then
              for PACKAGE in luci-app-bandix bandix luci-app-easytier easytier; do
                if grep -Eq "^CONFIG_PACKAGE_${PACKAGE}=[ym]$" .config; then
                  echo "::error::BE12 Pro unexpectedly includes $PACKAGE"; exit 1;
                fi
              done
            fi
            # The PassWall variant still includes the Xray updater and device-side UPX.
            if [[ "$WRT_CONFIG" == TENDA-BE12-PRO-PASSWALL ]]; then
              for PACKAGE in upx-arm64-static owrt-core-update; do
                grep -qx "CONFIG_PACKAGE_${PACKAGE}=y" .config || {
                  echo "::error::BE12 Pro Xray updater package missing: $PACKAGE"; exit 1;
                }
              done
            fi
          fi

          # daed 必须使用内核集成 BTF；否则 APK 会在固件安装时找不到 vmlinux-btf。
          if [[ "$WRT_CONFIG" == "TENDA-BE12-PRO-DAED" || "$WRT_CONFIG" == "SUPERGATEWAY-S20P" ]]; then
            for OPTION in KERNEL_DEBUG_INFO_BTF KERNEL_XDP_SOCKETS DAED_USE_KERNEL_BTF BPF_TOOLCHAIN_HOST PACKAGE_luci-app-daede_daed; do
              if ! grep -qx "CONFIG_${OPTION}=y" .config; then
                echo "::error::$WRT_CONFIG daed kernel BTF requirement missing after defconfig: $OPTION"
                exit 1
              fi
            done
          fi

          # S20P 必须保留正确设备及全部默认组件，不能被 defconfig 静默移除。
          if [[ "$WRT_CONFIG" == "SUPERGATEWAY-S20P" ]]; then
            for OPTION in TARGET_mediatek TARGET_mediatek_filogic \
                          TARGET_DEVICE_mediatek_filogic_DEVICE_supergateway_s20p \
                          PACKAGE_luci-app-passwall PACKAGE_luci-app-passwall_INCLUDE_Xray PACKAGE_xray-core \
                          PACKAGE_luci-app-daede PACKAGE_luci-app-daede_daed PACKAGE_daed \
                          PACKAGE_luci-app-bandix PACKAGE_bandix PACKAGE_kmod-sched-core PACKAGE_kmod-sched-bpf \
                          PACKAGE_luci-app-easytier PACKAGE_easytier \
                          PACKAGE_adguardhome PACKAGE_luci-app-adguardhome-dashboard; do
              if ! grep -qx "CONFIG_${OPTION}=y" .config; then
                echo "::error::Required S20P setting missing after defconfig: CONFIG_$OPTION"
                exit 1
              fi
            done
          fi

          # 防止缺失的包符号被 defconfig 静默移除，生成不含 fq 的固件。
          if [[ "$WRT_CONFIG" == "X86" ]]; then
            for PACKAGE in kmod-tcp-bbr kmod-sched tc-full xray-core \
                           adguardhome luci-app-adguardhome-dashboard; do
              if ! grep -qx "CONFIG_PACKAGE_${PACKAGE}=y" .config; then
                echo "::error::Required x86 package missing after defconfig: $PACKAGE"
                exit 1
              fi
            done

            # 防止上游依赖把已裁剪的包重新选中；私有/手动配置允许主动覆盖默认裁剪。
            if [[ ! -f "$GITHUB_WORKSPACE/Config/PRIVATE.txt" && -z "$WRT_PACKAGE" ]]; then
              CONFIG_ERRORS=0
              while IFS='=' read -r OPTION VALUE; do
                [[ "$OPTION" == CONFIG_PACKAGE_* && "$VALUE" == n ]] || continue
                if SELECTED=$(grep -E "^${OPTION}=[ym]$" .config); then
                  echo "::error::Disabled x86 package selected after defconfig: $SELECTED"
                  CONFIG_ERRORS=1
                fi
              done < "$GITHUB_WORKSPACE/Config/X86.txt"
              # 一次列出所有重新选中的包及 y/m 状态，避免只暴露第一个问题。
              if [[ "$CONFIG_ERRORS" != 0 ]]; then
                exit 1
              fi
            fi
          fi

          make clean -j$(nproc)

      - name: Install Host UPX for BE12 Pro Xray Compression
        if: ${{ inputs.WRT_CONFIG == 'TENDA-BE12-PRO-PASSWALL' }}
        run: bash "$GITHUB_WORKSPACE/Scripts/HostUPX.sh"

      # 每次先查询最新版本；缓存只复用同一版本、同一附件的 ZIP，不回退旧版本。
      - name: Restore Xray Download Cache
        id: xray-cache-restore
        if: ${{ env.XRAY_SOURCE != '' }}
        uses: actions/cache/restore@main
        with:
          key: xray-download-v1-${{env.XRAY_SOURCE}}
          path: ./wrt/dl/${{env.XRAY_SOURCE}}

      - name: Download Packages
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Save Xray Download Cache
        if: ${{ env.XRAY_SOURCE != '' && steps.xray-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: xray-download-v1-${{env.XRAY_SOURCE}}
          path: ./wrt/dl/${{env.XRAY_SOURCE}}

      - name: Save Build Cache
        if: ${{ success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
          echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

          find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

          for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
            EXT=$(basename $FILE | cut -d '.' -f 2-)
            NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
            NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE"."$EXT"
            mv -f $FILE ./upload/$NEW_FILE
          done

          find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

          make clean -j$(nproc)

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}


            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
